version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: devpassword123
      DOCKER_INFLUXDB_INIT_ORG: aiops
      DOCKER_INFLUXDB_INIT_BUCKET: raw_metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: devtoken123
    volumes:
      - influxdb-data:/var/lib/influxdb2

  neo4j:
    image: neo4j:5.15-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/devpassword123
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chromadb-data:/chroma/chroma

  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./services/dashboard/provisioning:/etc/grafana/provisioning
    depends_on:
      - influxdb

  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    environment:
      - KAFKA_BROKER=kafka:29092
    ports:
      - "8000:8000"
    depends_on:
      - kafka

volumes:
  influxdb-data:
  neo4j-data:
  chromadb-data:
  grafana-data:
